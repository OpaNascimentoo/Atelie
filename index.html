<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
  <title>Ateliê Bella Costura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:    #FAF7F2;
      --cream2:   #F3EDE3;
      --cream3:   #E8DDD0;
      --wine:     #6B2737;
      --wine2:    #8B3548;
      --wine-dim: rgba(107,39,55,0.12);
      --gold:     #B8955A;
      --gold2:    #D4AF7A;
      --charcoal: #2C2420;
      --warm-gray:#7A6F69;
      --light-text:#A89890;
      --white:    #FFFFFF;
      --card:     #FFFFFF;

      --status-prod-bg:  #FDF3E7; --status-prod-text:  #96580A; --status-prod-dot:  #E07B1A; --status-prod-bar: #E07B1A;
      --status-ag-bg:    #EEF2FF; --status-ag-text:    #3730A3; --status-ag-dot:    #6366F1; --status-ag-bar: #6366F1;
      --status-prova-bg: #FDF4FF; --status-prova-text: #86198F; --status-prova-dot: #C026D3; --status-prova-bar: #C026D3;
      --status-ent-bg:   #F0FDF4; --status-ent-text:   #166534; --status-ent-dot:   #16A34A; --status-ent-bar: #16A34A;

      --r-sm: 10px;
      --r-md: 16px;
      --r-lg: 22px;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans:  'Jost', sans-serif;
    }

    html, body, #root { height: 100%; }
    body {
      font-family: var(--font-sans);
      background: gray;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    #root {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background: var(--cream);
    }

    .screen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      transition: transform .38s cubic-bezier(.4,0,.2,1), opacity .3s ease;
      will-change: transform, opacity;
    }
    .screen.hidden-left  { transform: translateX(-100%); opacity: 0; pointer-events: none; }
    .screen.hidden-right { transform: translateX(100%);  opacity: 0; pointer-events: none; }
    .screen.visible      { transform: translateX(0);     opacity: 1; }


    #screen-login {
      background: var(--charcoal);
      align-items: center;
      justify-content: center;
      padding: 36px 28px;
      overflow: hidden;
    }


    #screen-login::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        radial-gradient(circle, rgba(184,149,90,0.08) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }
    .login-deco-top {
      position: absolute; top: -60px; right: -60px;
      width: 240px; height: 240px; border-radius: 50%;
      border: 60px solid rgba(107,39,55,0.2);
      pointer-events: none;
    }
    .login-deco-bot {
      position: absolute; bottom: -80px; left: -40px;
      width: 200px; height: 200px; border-radius: 50%;
      border: 50px solid rgba(184,149,90,0.12);
      pointer-events: none;
    }

    .login-inner { width: 100%; max-width: 360px; z-index: 1; }

    /* Logo */
    .logo-wrap { text-align: center; margin-bottom: 36px; }
    .logo-emblem {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--wine);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 0 0 8px rgba(107,39,55,0.18), 0 12px 32px rgba(107,39,55,0.35);
    }
    .logo-emblem svg { width: 34px; height: 34px; stroke: var(--gold2); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .logo-name {
      font-family: var(--font-serif);
      font-size: 32px; font-weight: 400;
      color: var(--cream); letter-spacing: 1px;
      line-height: 1;
    }
    .logo-name em { color: var(--gold2); font-style: italic; }
    .logo-tagline { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--light-text); margin-top: 8px; }

    /* Card */
    .login-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--r-lg);
      padding: 32px 28px;
      backdrop-filter: blur(10px);
    }
    .login-title { font-family: var(--font-serif); font-size: 26px; font-weight: 400; color: var(--cream); margin-bottom: 4px; }
    .login-title em { font-style: italic; color: var(--gold2); }
    .login-subtitle { font-size: 13px; color: rgba(250,247,242,0.45); margin-bottom: 28px; letter-spacing: 0.3px; }

    .field { margin-bottom: 16px; }
    .field-label { display: block; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: rgba(250,247,242,0.4); margin-bottom: 8px; }
    .field-wrap {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--r-sm);
      padding: 0 14px; height: 50px;
      transition: border-color .2s, box-shadow .2s;
    }
    .field-wrap:focus-within {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(184,149,90,0.15);
    }
    .field-icon { width: 16px; height: 16px; stroke: rgba(250,247,242,0.3); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; transition: stroke .2s; }
    .field-wrap:focus-within .field-icon { stroke: var(--gold2); }
    .field-wrap input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--cream); font-family: var(--font-sans); font-size: 14px;
    }
    .field-wrap input::placeholder { color: rgba(250,247,242,0.2); }
    .eye-btn { background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; }
    .eye-btn svg { width: 16px; height: 16px; stroke: rgba(250,247,242,0.3); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .error-msg {
      display: none; margin-bottom: 14px;
      color: #FCA5A5; font-size: 12px;
      padding: 8px 12px;
      background: rgba(252,165,165,0.1);
      border: 1px solid rgba(252,165,165,0.2);
      border-radius: 8px;
    }
    .error-msg.show { display: block; }

    .forgot { text-align: right; margin-bottom: 22px; }
    .forgot a { font-size: 12px; color: var(--gold2); text-decoration: none; opacity: .8; }

    .btn-login {
      width: 100%; height: 50px;
      background: var(--wine);
      border: none; border-radius: var(--r-sm);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      color: var(--cream);
      font-family: var(--font-sans); font-size: 13px; font-weight: 500;
      letter-spacing: 2px; text-transform: uppercase;
      box-shadow: 0 8px 24px rgba(107,39,55,0.4);
      transition: filter .15s, transform .15s;
    }
    .btn-login:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-login:active { transform: scale(0.98); }
    .btn-login svg { width: 16px; height: 16px; stroke: var(--gold2); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .login-footer { display: flex; justify-content: center; gap: 6px; margin-top: 22px; font-size: 12px; color: rgba(250,247,242,0.35); }
    .login-footer a { color: var(--gold2); text-decoration: none; }
    .version-tag { text-align: center; font-size: 11px; color: rgba(250,247,242,0.2); margin-top: 24px; letter-spacing: 1px; }

    /* ── MAIN ───────────────────────────────────── */
    #screen-main { background: var(--cream); }

    /* Header */
    .app-header {
      background: var(--charcoal);
      padding: 14px 20px 16px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
      position: relative;
    }
    .app-header::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.4;
    }
    .h-left { display: flex; align-items: center; gap: 12px; }
    .h-emblem {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--wine);
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(184,149,90,0.3);
    }
    .h-emblem svg { width: 18px; height: 18px; stroke: var(--gold2); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .h-name { font-family: var(--font-serif); font-size: 18px; font-weight: 400; color: var(--cream); letter-spacing: 0.5px; }
    .h-name em { color: var(--gold2); font-style: italic; }
    .h-sub { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: rgba(250,247,242,0.35); margin-top: 1px; }
    .h-right { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative;
      transition: background .2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.12); }
    .icon-btn svg { width: 18px; height: 18px; stroke: rgba(250,247,242,0.7); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .notif-pip { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--wine2); border: 1.5px solid var(--charcoal); }
    .avatar-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--wine);
      border: 1px solid rgba(184,149,90,0.35);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-family: var(--font-sans); font-size: 12px; font-weight: 500; color: var(--gold2);
      transition: filter .2s;
    }
    .avatar-btn:hover { filter: brightness(1.15); }

    .nav-tabs {
      display: flex; gap: 8px; overflow-x: auto;
      padding: 12px 18px 0; background: var(--cream);
      border-bottom: 1px solid var(--cream3);
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .nav-tab {
      border: 1px solid var(--cream3); background: var(--white);
      color: var(--warm-gray); border-radius: 999px;
      font-size: 11px; letter-spacing: 0.5px; font-family: var(--font-sans);
      padding: 7px 12px; cursor: pointer; white-space: nowrap;
      transition: all .15s ease;
    }
    .nav-tab.active {
      background: var(--wine); border-color: var(--wine);
      color: var(--cream); box-shadow: 0 5px 18px rgba(107,39,55,0.18);
    }

    /* Scroll */
    .main-scroll {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 20px 18px 100px;
      -webkit-overflow-scrolling: touch;
    }
    .main-scroll::-webkit-scrollbar { display: none; }

    /* Stats */
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
    .stat-card {
      border-radius: var(--r-sm);
      padding: 12px 6px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .stat-card.s-prod  { background: var(--status-prod-bg); }
    .stat-card.s-ag    { background: var(--status-ag-bg); }
    .stat-card.s-prova { background: var(--status-prova-bg); }
    .stat-card.s-ent   { background: var(--status-ent-bg); }
    .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
    .stat-num { font-family: var(--font-serif); font-size: 24px; font-weight: 600; color: var(--charcoal); line-height: 1; }
    .stat-lbl { font-size: 9px; letter-spacing: 0.5px; text-align: center; line-height: 1.3; }
    .s-prod  .stat-lbl { color: var(--status-prod-text); }
    .s-ag    .stat-lbl { color: var(--status-ag-text); }
    .s-prova .stat-lbl { color: var(--status-prova-text); }
    .s-ent   .stat-lbl { color: var(--status-ent-text); }

    /* Search */
    .search-row { display: flex; gap: 10px; margin-bottom: 22px; }
    .search-wrap {
      flex: 1; display: flex; align-items: center; gap: 8px;
      background: var(--white);
      border: 1px solid var(--cream3);
      border-radius: var(--r-sm);
      padding: 0 14px; height: 46px;
    }
    .search-wrap:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(184,149,90,0.1); }
    .search-wrap svg { width: 15px; height: 15px; stroke: var(--light-text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .search-wrap input { flex: 1; background: transparent; border: none; outline: none; font-family: var(--font-sans); font-size: 13px; color: var(--charcoal); }
    .search-wrap input::placeholder { color: var(--light-text); }
    .clear-btn { background: none; border: none; cursor: pointer; padding: 2px; display: flex; align-items: center; }
    .clear-btn svg { width: 14px; height: 14px; stroke: var(--cream3); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .filter-btn {
      width: 46px; height: 46px; border-radius: var(--r-sm);
      background: var(--wine); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(107,39,55,0.35);
      flex-shrink: 0; transition: filter .15s;
    }
    .filter-btn:hover { filter: brightness(1.12); }
    .filter-btn svg { width: 18px; height: 18px; stroke: var(--gold2); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* Section header */
    .sec-hdr { display: flex; align-items: center; gap: 10px; margin: 6px 0 13px; }
    .sec-rule { flex: 1; height: 1px; background: var(--cream3); }
    .sec-title { font-family: var(--font-serif); font-size: 15px; font-weight: 500; color: var(--charcoal); white-space: nowrap; letter-spacing: 0.3px; }
    .sec-title em { color: var(--gold); font-style: italic; }
    .sec-badge { font-size: 10px; font-weight: 500; padding: 2px 9px; border-radius: 20px; white-space: nowrap; }

    /* Cards */
    .order-card {
      background: var(--white);
      border-radius: var(--r-md);
      margin-bottom: 10px;
      border: 1px solid var(--cream3);
      overflow: hidden;
      display: flex;
      transition: transform .15s, box-shadow .15s;
    }
    .order-card:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(44,36,32,0.1); }
    .card-ribbon { width: 4px; flex-shrink: 0; }
    .card-body { flex: 1; padding: 14px 14px 12px; }

    /* Card top row */
    .card-top { display: flex; align-items: flex-start; gap: 10px; }
    .svc-thumb {
      width: 42px; height: 42px; border-radius: 10px;
      background: var(--cream2);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      border: 1px solid var(--cream3);
    }
    .svc-thumb svg { width: 20px; height: 20px; stroke: var(--wine); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .card-meta { flex: 1; min-width: 0; }
    .card-client { font-family: var(--font-serif); font-size: 16px; font-weight: 500; color: var(--charcoal); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
    .card-service { font-size: 12px; color: var(--warm-gray); margin-top: 2px; }
    .card-peca {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase;
      color: var(--warm-gray); margin-top: 4px;
    }
    .card-peca svg { width: 10px; height: 10px; stroke: var(--light-text); fill: none; stroke-width: 2; }
    .status-pill {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 9px; border-radius: 20px;
      border-width: 1px; border-style: solid;
      white-space: nowrap; flex-shrink: 0;
    }
    .status-pip { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .status-txt { font-size: 10px; font-weight: 500; letter-spacing: 0.3px; }

    .card-divider { height: 1px; background: var(--cream2); margin: 10px 0; }

    .card-foot { display: flex; align-items: center; gap: 12px; }
    .c-meta { display: flex; align-items: center; gap: 4px; }
    .c-meta svg { width: 12px; height: 12px; stroke: var(--light-text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .c-meta span { font-size: 11px; color: var(--warm-gray); font-weight: 400; }
    .mini-photo {
      width: 52px; height: 52px; object-fit: cover; border-radius: 12px;
      border: 1px solid var(--cream3); background: var(--cream2);
      flex-shrink: 0;
    }
    .details-btn {
      margin-left: auto;
      display: flex; align-items: center; gap: 3px;
      background: var(--cream2); border: 1px solid var(--cream3);
      border-radius: 20px; padding: 4px 11px;
      color: var(--wine); cursor: pointer;
      font-family: var(--font-sans); font-size: 11px; font-weight: 500;
      transition: background .15s, transform .15s;
    }
    .details-btn:hover { background: var(--cream3); transform: translateX(1px); }
    .details-btn svg { width: 11px; height: 11px; stroke: var(--wine); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }


    .empty-state { display: flex; flex-direction: column; align-items: center; padding: 56px 20px; gap: 10px; }
    .empty-state svg { width: 44px; height: 44px; stroke: var(--cream3); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .empty-title { font-family: var(--font-serif); font-size: 18px; color: var(--warm-gray); }
    .empty-sub { font-size: 12px; color: var(--light-text); }

    
    .fab {
      position: fixed; bottom: 26px;
      right: calc(50% - 215px + 18px);
      width: 54px; height: 54px; border-radius: 50%;
      background: var(--wine); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 24px rgba(107,39,55,0.45);
      z-index: 100;
      transition: transform .15s, filter .15s;
    }
    .fab:hover { transform: scale(1.06); filter: brightness(1.1); }
    .fab:active { transform: scale(0.96); }
    .fab svg { width: 24px; height: 24px; stroke: var(--gold2); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(44,36,32,0.55);
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal-sheet {
      background: var(--cream); width: 100%; max-width: 430px;
      border-top-left-radius: 22px; border-top-right-radius: 22px;
      padding: 16px 24px 36px;
      transform: translateY(100%);
      transition: transform .32s cubic-bezier(.4,0,.2,1);
    }
    .modal-overlay.open .modal-sheet { transform: translateY(0); }
    .modal-handle { width: 36px; height: 3px; background: var(--cream3); border-radius: 2px; margin: 0 auto 18px; }
    .modal-title { font-family: var(--font-serif); font-size: 20px; font-weight: 400; color: var(--charcoal); margin-bottom: 4px; }
    .modal-service { font-size: 12px; color: var(--warm-gray); letter-spacing: 0.3px; margin-bottom: 18px; }
    .modal-divider { height: 1px; background: var(--cream3); margin-bottom: 14px; }
    .modal-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--cream2); }
    .modal-row:last-of-type { border-bottom: none; }
    .modal-lbl { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--light-text); }
    .modal-val { font-size: 14px; color: var(--charcoal); font-weight: 500; }
    .modal-close {
      width: 100%; height: 48px; margin-top: 22px;
      background: var(--wine); border: none; border-radius: var(--r-sm);
      color: var(--cream); font-family: var(--font-sans); font-size: 12px;
      font-weight: 500; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; transition: filter .15s;
    }
    .modal-close:hover { filter: brightness(1.1); }

    .section-action-bar {
      display: flex; justify-content: flex-end; margin: 18px 2px 8px;
    }
    .primary-btn, .secondary-btn, .danger-btn, .mini-action {
      border: none; border-radius: 12px; cursor: pointer;
      font-family: var(--font-sans); font-weight: 600; transition: filter .15s, transform .15s;
    }
    .primary-btn:hover, .secondary-btn:hover, .danger-btn:hover, .mini-action:hover {
      filter: brightness(1.04); transform: translateY(-1px);
    }
    .primary-btn {
      background: var(--wine); color: var(--cream); padding: 12px 18px;
      font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    }
    .secondary-btn {
      background: var(--cream2); color: var(--charcoal); padding: 12px 16px;
      font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
    }
    .danger-btn {
      background: #b25a5a; color: #fff; padding: 11px 14px;
      font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
    }
    .mini-action {
      padding: 8px 10px; font-size: 10px; letter-spacing: 0.8px; text-transform: uppercase;
      background: var(--cream2); color: var(--charcoal);
    }
    .mini-action.danger {

  return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

  }

  document.getElementById('list-wrap').innerHTML = `

function openEntityForm(type, item = null) {
  const def = ENTITY_DEFS[type];
  if (!def) return;

  const isEdit = !!item;
  const fieldsMarkup = def.fields.map((field) => {
    const value = item && item[field.name] !== undefined ? item[field.name] : '';
    const id = `field-${type}-${field.name}`;

    if (field.type === 'select') {
      const options = field.options.map((option) => {
        const selected = String(value || '') === String(option) ? 'selected' : '';
        return `<option value="${escapeHtml(option)}" ${selected}>${escapeHtml(option)}</option>`;
      }).join('');
      return `
        <div class="entity-field">
          <label for="${id}">${field.label}</label>
          <select id="${id}" name="${field.name}">${options}</select>
        </div>`;
    }

    const textarea = field.type === 'textarea';
    const inputType = field.type === 'number' ? 'number' : field.type === 'email' ? 'email' : 'text';
    const inputValue = escapeHtml(value);
    const extra = field.placeholder ? `placeholder="${escapeHtml(field.placeholder)}"` : '';
    const required = field.required ? 'required' : '';

    if (textarea) {
      return `
        <div class="entity-field">
          <label for="${id}">${field.label}</label>
          <textarea id="${id}" name="${field.name}" ${required}>${inputValue}</textarea>
        </div>`;
    }

    return `
      <div class="entity-field">
        <label for="${id}">${field.label}</label>
        <input id="${id}" name="${field.name}" type="${inputType}" value="${inputValue}" ${required} ${extra} />
      </div>`;
  }).join('');

  document.getElementById('modal-inner').innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">${isEdit ? 'Editar' : 'Novo'} ${def.label}</div>
    <div class="modal-service">${isEdit ? 'Atualize os dados da entidade.' : 'Cadastre uma nova informação no sistema.'}</div>
    <form class="entity-form" id="entity-form" data-type="${type}" data-id="${item && item.id ? item.id : ''}">
      <div class="field-grid">${fieldsMarkup}</div>
      <div class="form-actions">
        <button type="button" class="secondary-btn" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="primary-btn">${isEdit ? 'Salvar' : 'Cadastrar'}</button>
      </div>
    </form>
  `;
  document.getElementById('modal-ov').classList.add('open');
}

async function submitEntityForm(event) {
  event.preventDefault();
  const form = event.target.closest('#entity-form');
  if (!form) return;

  const type = form.dataset.type;
  const def = ENTITY_DEFS[type];
  if (!def) return;

  const payload = {};
  const formData = new FormData(form);
  formData.forEach((value, key) => {
    if (key === 'preco' || key === 'valor_unitario' || key === 'valor_total' || key === 'quantidade' || key === 'pedidos') {
      payload[key] = Number(value) || 0;
    } else if (key === 'reaproveitado') {
      payload[key] = value === 'true';
    } else {
      payload[key] = value;
    }
  });

  const isEdit = !!form.dataset.id;
  const url = `${def.endpoint}${isEdit ? `/${form.dataset.id}` : ''}`;
  const response = await fetch(url, {
    method: isEdit ? 'PUT' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    throw new Error(data.error || 'Não foi possível salvar o registro.');
  }

  closeModal();
  if (currentView === 'dashboard') {
    renderList();
    return;
  }

  renderView(currentView);
}

async function deleteEntity(type, id) {
  const def = ENTITY_DEFS[type];
  if (!def) return;

  if (!confirm(`Deseja realmente excluir este ${def.label.toLowerCase()}?`)) return;

  const response = await fetch(`${def.endpoint}/${id}`, { method: 'DELETE' });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    alert(data.error || 'Não foi possível excluir o registro.');
    return;
  }

  if (currentView === 'dashboard') {
    renderList();
    return;
  }
  renderView(currentView);
}

async function renderList() {

  try {

  }

  const q = query.toLowerCase();

  document.getElementById('cnt-ent').textContent = filtered.filter(p => p.status === 'Entregue').length;

  const groups = [
    { label:'Em <em>Produção</em>',       key:'Em Produção',       bb:'var(--status-prod-bg)',  bc:'var(--status-prod-text)'  },
    { label:'<em>Agendados</em>',          key:'Agendado',          bb:'var(--status-ag-bg)',    bc:'var(--status-ag-text)'    },
    { label:'Pronto para <em>Prova</em>',  key:'Pronto para Prova', bb:'var(--status-prova-bg)', bc:'var(--status-prova-text)' },
    { label:'<em>Entregues</em>',          key:'Entregue',          bb:'var(--status-ent-bg)',   bc:'var(--status-ent-text)'   },
  ];

  let html = '';
  groups.forEach(g => {

    if (items.length === 0) return;
    html += secHdr(g.label, items.length, g.bb, g.bc);
    items.forEach(p => html += card(p));

      <div class="empty-title">Nenhum pedido encontrado</div>
      <div class="empty-sub">Tente outro nome, serviço ou peça.</div>

  document.getElementById('list-wrap').innerHTML = html;
}
